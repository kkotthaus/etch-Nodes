<!-- Node: tool-input – Werkzeug-Icon klappt ein Eingabefeld auf -->
<div class="tool-input" data-tool-input>
  <button
    class="tool-input__toggle"
    type="button"
    aria-expanded="false"
    aria-controls="tool-input-field-1"
    aria-label="Eingabefeld öffnen"
    data-label-open="Eingabefeld öffnen"
    data-label-close="Eingabefeld schließen"
  >
    <svg class="tool-input__icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"
      fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
    </svg>
  </button>

  <div class="tool-input__field" id="tool-input-field-1" inert>
    <div class="tool-input__field-inner">
      <label class="tool-input__label" for="tool-input-1">Eingabe</label>
      <input class="tool-input__input" id="tool-input-1" name="tool-input" type="text" placeholder="Eingabe …" autocomplete="off">
    </div>
  </div>
</div>
